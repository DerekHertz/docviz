name: Claude

# `@claude <role>` in a PR or issue comment, review, or review comment starts that
# Dim Sum Dev role (the `den-roles` plugin from DerekHertz/DimSumDev) on this repo with the
# owner's Claude login: `@claude qa`, `@claude security`, `@claude code-reviewer`, `technical-writer`,
# `architect`.
# A bare `@claude` is the developer. Same shape as Anthropic's own `@claude review`
# (Code Review), which this list leaves alone. Only the repo owner's comments count: the repo
# is public, and anyone else's mention would spend the owner's plan. The den's
# reviewers post as the owner, so their hand-offs count.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && contains(format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude') && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The role is the word after the mention, from a fixed list; anything else is the developer.
      # The comment arrives through env, never spliced into the script.
      - name: Pick the den role
        id: role
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          role=$(printf '%s' "$BODY" | grep -oE '@claude[[:space:]]+(den:)?(developer|code-reviewer|qa|security|technical-writer|architect)([^a-z-]|$)' | head -1 | sed -E 's/^@claude[[:space:]]+(den:)?//; s/[^a-z-]+$//')
          echo "role=${role:-developer}" >> "$GITHUB_OUTPUT"
          echo "Dispatching den-roles:${role:-developer}"
      # The action allows only read tools by default; a den role also needs Edit/Write to fix,
      # and Skill/Agent for its team protocol and runner. Each role's own `tools:` list still
      # applies, so qa, code-reviewer and security can't edit.
      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The den's roles for CI (role files only, with a GitHub-dispatch protocol; no board).
          plugin_marketplaces: https://github.com/DerekHertz/DimSumDev.git
          plugins: den-roles@dimsumden-mods
          claude_args: >-
            --agent den-roles:${{ steps.role.outputs.role }}
            --allowedTools "Edit,MultiEdit,Write,TodoWrite,Skill,Agent,Bash(npm run check:*),Bash(npm test:*),Bash(node --check:*),Bash(node --test:*),Bash(ls:*),Bash(git:*),Bash(gh pr:*)"
            --append-system-prompt "Your report goes in your tracking comment on the pull request: update it with mcp__github_comment__update_claude_comment, replacing the placeholder."
      # The developer role leaves pushing to the release step; here that step is this one. It pushes with
      # the token the action used (the Claude GitHub App's): a push with GITHUB_TOKEN starts no CI, so the
      # required `test` check would never run on the role's commits.
      - name: Push the role's commits
        if: steps.role.outputs.role != 'qa' && steps.role.outputs.role != 'code-reviewer' && steps.role.outputs.role != 'security'
        env:
          TOKEN: ${{ steps.claude.outputs.github_token }}
          REPO: ${{ github.repository }}
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" != "HEAD" ] && [ "$branch" != "main" ] && [ -n "$(git log --oneline "origin/$branch..HEAD" 2>/dev/null)" ]; then
            git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:$branch"
          fi
